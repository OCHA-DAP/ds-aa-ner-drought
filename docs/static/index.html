      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "1fcd2284b023efbe3f15647ca412ba96", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "609870b023d70dbacb28a798da3b9807", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "58bcc867cb1ebcd9532784b45cb14cd1", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "88424b4dbed3cbfd969b2b2f011ef1de", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EData source:\u003C/strong\u003E Historical IRI forecasts exported from the Maproom on \u003Cstrong\u003E25 April 2026\u003C/strong\u003E,\nusing the \u003Cstrong\u003EOCHA Certification\u003C/strong\u003E model with the Frequency slider set to \u003Cstrong\u003E35%\u003C/strong\u003E.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d7157f98008c879574111fed05dc76e4", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"forecast-and-observational-thresholds\"\u003EForecast and observational thresholds\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EUse the sliders to set the threshold for each trigger component. The \u003Cstrong\u003Eforecast component\u003C/strong\u003E\ntriggers if any two consecutive months (Jan+Feb, Feb+Mar, \u2026, May+Jun) both fall in the\ntop X% of their rolling 10-year historical reference window. The \u003Cstrong\u003Eobservational component\u003C/strong\u003E\ntriggers if the ENACTS SPI falls in the bottom Y% of the full historical record.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe 2\u00d73 grid shows all six forecast months. The observational chart shows ENACTS SPI\nagainst the fixed historical threshold. Red markers = triggered.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "643d611e7f4e09975bc3ff42e5b685b7", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "35a3f70d11282ceef75a1b7210dc939f", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ed8801b2b279c2e8414034bffb6dd8f1", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "11fbb01cff3d0d3f4725264280c32fd4", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "727bacd57ab22df8e77f7c05e4e2709e", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dc7ada6b13796f50d5b15d6afdd69a81", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "12e9f3cd7aa963b49d021997bc0a7937", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "46f6a2536e87fb70c1095ea884851cd9", "console": [], "id": "Hstk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7ed16871b597d2f123a427caf7b77098", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EForecast component:\u003C/strong\u003E \u003Cmarimo-ui-element object-id='Xref-0' random-id='c045812f-f7de-68d9-8a95-d814c305653c'\u003E\u003Cmarimo-slider data-initial-value='35' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92; le level, each evaluation year is assessed: the\n\u003Cstrong\u003Eforecast component\u003C/strong\u003E triggers if any two consecutive months (Jan+Feb, Feb+Mar, \u2026,\nMay+Jun) both exceed their rolling 10-year historical threshold. The table\nbelow shows, for each percentile, how many years trigger under each component and\nthe implied return period when combined with the observational component.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a19e63ab2d9f87cf779d02b37cab125f", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"trigger-counts-by-percentile-threshold\"\u003ETrigger counts by percentile threshold\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EObservational component fixed at bottom \u003Cstrong\u003E15%\u003C/strong\u003E of full record. Rows closest to target RP 3.5: pct = [35, 40]\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ZBYS-0' random-id='4cdda561-cb97-c0f7-4122-a64dbc6fbf42'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;pct_triggering\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;n_fcast\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;rp_fcast\u0026#92;\u0026quot;:\u0026#92;\u0026quot;inf\u0026#92;\u0026quot;,\u0026#92;\u0026quot;n_obsv (SPI\u0026#92;\u0026#92;u226415%)\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;rp_obsv (SPI\u0026#92;\u0026#92;u226415%)\u0026#92;\u0026quot;:6.5,\u0026#92;\u0026quot;n_either\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;rp_either\u0026#92;\u0026quot;:6.5},{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;pct_triggering\u0026#92;\u0026quot;:5,\u0026#92;\u0026quot;n_fcast\u00 , "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-automatic-threshold-selection\"\u003E3 \u00b7 Automatic threshold selection\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe forecast percentile whose \u003Cstrong\u003Ecombined return period is closest to 3.5 years\u003C/strong\u003E\nis identified automatically. The years that would have triggered under each component\nare listed here.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e1c2976224c6d24d0ceff11847cb769b", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAt \u003Cstrong\u003Epct = 35%\u003C/strong\u003E (closest to RP 3.5):\u003Cbr /\u003E\nForecast component: \u003Cstrong\u003E[2001, 2009, 2011, 2023]\u003C/strong\u003E\u003Cbr /\u003E\nObservational component (ENACTS SPI \u226415%): \u003Cstrong\u003E[2004, 2006, 2013, 2022]\u003C/strong\u003E\u003Cbr /\u003E\nCombined: \u003Cstrong\u003E[2001, 2004, 2006, 2009, 2011, 2013, 2022, 2023]\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "15dce3b8663d430ee02ca2c8628272c5", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"single-month-detail\"\u003ESingle-month detail\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThe interactive chart shows the rolling 10-year threshold (blue line, from 2001)\nand actual IRI forecast values for the selected month. Hover the blue threshold\nmarkers to see the reference years and sorted values behind each threshold.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EMonth\u003C/strong\u003E selects which forecast month is shown. \u003Cstrong\u003E% triggering from top\u003C/strong\u003E is\ncontrolled by the slider at the top of the page.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "43da3b0f1d290bfc2404d9ca02140ecb", "console": [], "id": "AjVT", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='AjVT-0' random-id='3a4d5358-9434-6a58-71cf-3452b01868a3'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;Jan\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMonth\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;Jan\u0026quot;,\u0026quot;Feb\u0026quot;,\u0026quot;Mar\u0026quot;,\u0026quot;Apr\u0026quot;,\u0026quot;May\u0026quot;,\u0026quot;Jun\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='true'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "91dfe11ef442ef254f066bf5481ebbeb", "console": [], "id": "pHFh", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='pHFh-0' random-id='87281b65-7dc3-e3bf-48df-486bfe50a804'\u003E\u003Cmarimo-vega data-initial-value='{}' data-label='null' data-spec='{\u0026quot;config\u0026quot;:{\u0026quot;view\u0026quot;:{\u0026quot;continuousWidth\u0026quot;:300,\u0026quot;continuousHeight\u0026quot;:300,\u0026quot;strokeWidth\u0026quot;:0},\u0026quot;axis\u0026quot;:{\u0026quot;grid\u0026quot;:false}},\u0026quot;layer\u0026quot;:[{\u0026quot;data\u0026quot;:{\u0026quot;url\u0026quot;:\u0026quot;data:text/plain;base64,QVJST1cxAAD/////yAMAABAAAAAAAAoADgAGAAUACAAKAAAAAAEEABAAAAAAAAoADAAAAAQACAAKAAAA3AIAAAQAAAABAAAADAAAAAgADAAEAAgACAAAALQCAAAEAAAApQIAAHsiaW5kZXhfY29sdW1ucyI6IFt7ImtpbmQiOiAicmFuZ2UiLCAibmFtZSI6IG51bGwsICJzdGFydCI6IDAsICJzdG9wIjogMTAsICJzdGVwIjogMX1dLCAiY29sdW1uX2luZGV4ZXMiOiBbeyJuYW1lIjogbnVsbCwg
