      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "1fcd2284b023efbe3f15647ca412ba96", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "609870b023d70dbacb28a798da3b9807", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "58bcc867cb1ebcd9532784b45cb14cd1", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "88424b4dbed3cbfd969b2b2f011ef1de", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EData source:\u003C/strong\u003E Historical IRI forecasts exported from the Maproom on \u003Cstrong\u003E25 April 2026\u003C/strong\u003E,\nusing the \u003Cstrong\u003EOCHA Certification\u003C/strong\u003E model with the Frequency slider set to \u003Cstrong\u003E35%\u003C/strong\u003E.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d7157f98008c879574111fed05dc76e4", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"forecast-and-observational-thresholds\"\u003EForecast and observational thresholds\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EUse the sliders to set the threshold for each trigger component. The \u003Cstrong\u003Eforecast component\u003C/strong\u003E\ntriggers if any two consecutive months (Jan+Feb, Feb+Mar, \u2026, May+Jun) both fall in the\ntop X% of their rolling 10-year historical reference window. The \u003Cstrong\u003Eobservational component\u003C/strong\u003E\ntriggers if the ENACTS SPI falls in the bottom Y% of the full historical record.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe 2\u00d73 grid shows all six forecast months. The observational chart shows ENACTS SPI\nagainst the fixed historical threshold. Red markers = triggered.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "643d611e7f4e09975bc3ff42e5b685b7", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "35a3f70d11282ceef75a1b7210dc939f", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ed8801b2b279c2e8414034bffb6dd8f1", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "11fbb01cff3d0d3f4725264280c32fd4", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "727bacd57ab22df8e77f7c05e4e2709e", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dc7ada6b13796f50d5b15d6afdd69a81", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "12e9f3cd7aa963b49d021997bc0a7937", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "46f6a2536e87fb70c1095ea884851cd9", "console": [], "id": "Hstk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "560a761bf546b488af2f6173b098eefe", "console": [], "id": "nWHF", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7ed16871b597d2f123a427caf7b77098", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EForecast component:\u003C/strong\u003E \u003Cmarimo-ui-element object-id='Xref-0' random-id='e54ee7e5-7955-d0e3-ea48-0fd964ed33d5'\u003E\u003Cmarimo-slider data-initial-value='35' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;mark t. A \u003Cstrong\u003ET\u003C/strong\u003E marks a trigger (red cells); blank = no\ntrigger. Hover rows to highlight.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEach consecutive-month pair belongs to a framework window by its \u003Cem\u003Edecision month\u003C/em\u003E (the\nlater month of the pair): \u003Cstrong\u003EWindow 1\u003C/strong\u003E = Jan+Feb, Feb+Mar (decisions Feb\u2013Mar);\n\u003Cstrong\u003EWindow 2\u003C/strong\u003E = Mar+Apr, Apr+May, May+Jun (decisions Apr\u2013Jun) \u003Cem\u003Eor\u003C/em\u003E the observational\ncomponent.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECERF RR\u003C/strong\u003E (blue) shows CERF Rapid Response allocations for drought in Niger (total\nUSD per season), attributed to the \u003Cem\u003Erainy-season\u003C/em\u003E year via each allocation's validity\nperiod \u2014 allocations often land the following calendar year (e.g. the 2010 allocations\nrespond to the failed Jun\u2013Sep 2009 rains). The 2022 amount is the framework's own\nanticipatory allocation. A 2008 drought-labelled allocation is excluded (food-price\ncrisis, not a failed season). Source: team DB \u003Ccode\u003Eaa.cerf_allocation\u003C/code\u003E +\n\u003Ccode\u003Eaa.cerf_supplement\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "04dd6eaad987c34a0bf73a4862ff5698", "console": [], "id": "DnEU", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"per-year-trigger-detail-forecast-component-top-35\"\u003EPer-year trigger detail (forecast component: top 35%)\u003C/h3\u003E\u003C/span\u003E\u003Cstyle\u003E\n#T_trigger_detail {\nborder-collapse: collapse;\nborder-top: 2px solid currentColor;\nborder-bottom: 2px solid currentColor;\n}\n#T_trigger_detail thead th {\nborder- cast threshold sweep \u2192 return period table\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EFor every candidate percentile level, each evaluation year is assessed: the\n\u003Cstrong\u003Eforecast component\u003C/strong\u003E triggers if any two consecutive months (Jan+Feb, Feb+Mar, \u2026,\nMay+Jun) both exceed their rolling 10-year historical threshold. The table\nbelow shows, for each percentile, how many years trigger under each component and\nthe implied return period when combined with the observational component.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a19e63ab2d9f87cf779d02b37cab125f", "console": [], "id": "aLJB", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"trigger-counts-by-percentile-threshold\"\u003ETrigger counts by percentile threshold\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EObservational component fixed at bottom \u003Cstrong\u003E15%\u003C/strong\u003E of full record. Rows closest to target RP 3.5: pct = [35, 40]\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='aLJB-0' random-id='082118a2-6302-ae56-7c62-68fa042df48a'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;pct_triggering\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;n_fcast\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;rp_fcast\u0026#92;\u0026quot;:\u0026#92;\u0026quot;inf\u0026#92;\u0026quot;,\u0026#92;\u0026quot;n_obsv (SPI\u0026#92;\u0026#92;u226415%)\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;rp_obsv (SPI\u0026#92;\u0026#92;u226415%)\u0026#92;\u0026quot;:6.5,\u0026#92;\u0026quot;n_either\u0026#92;\u0026quot;:4,\u0026#92;\u0026quot;rp_either\u0026#92;\u0026quot;:6.5},{\u0026#92;\u0026quot;_
