[project]
name = "ds-aa-ner-drought"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.23.1",
    "ocha-stratus>=0.1.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "geopandas>=1.0",
    "xarray>=2024.0",
    "rioxarray>=0.18",
    "altair>=5.0",
]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
